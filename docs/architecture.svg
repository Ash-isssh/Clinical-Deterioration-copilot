<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f7f8fa"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Clinical Deterioration &amp; Escalation Copilot</text>
  <text x="600" y="68" text-anchor="middle" font-family="Arial" font-size="13" fill="#52606d">Synthetic streaming demo with deterministic risk guardrails, local RAG and clinician review</text>

  <g font-family="Arial" font-size="14" fill="#18212b">
    <rect x="55" y="115" rx="12" ry="12" width="190" height="75" fill="#ffffff" stroke="#9aa7b3"/>
    <text x="150" y="145" text-anchor="middle" font-weight="700">Synthetic vitals</text>
    <text x="150" y="167" text-anchor="middle">CSV replay</text>

    <rect x="300" y="115" rx="12" ry="12" width="190" height="75" fill="#ffffff" stroke="#9aa7b3"/>
    <text x="395" y="145" text-anchor="middle" font-weight="700">FastAPI /vitals</text>
    <text x="395" y="167" text-anchor="middle">validation + intake</text>

    <rect x="545" y="115" rx="12" ry="12" width="220" height="75" fill="#ffffff" stroke="#9aa7b3"/>
    <text x="655" y="145" text-anchor="middle" font-weight="700">PatientState</text>
    <text x="655" y="167" text-anchor="middle">recent vitals + static context</text>

    <rect x="820" y="115" rx="12" ry="12" width="300" height="75" fill="#ffffff" stroke="#9aa7b3"/>
    <text x="970" y="145" text-anchor="middle" font-weight="700">Trend + deterioration detection</text>
    <text x="970" y="167" text-anchor="middle">multi-parameter window checks</text>

    <rect x="135" y="290" rx="12" ry="12" width="250" height="95" fill="#eef5fb" stroke="#7da1bf"/>
    <text x="260" y="323" text-anchor="middle" font-weight="700">NEWS2-derived score</text>
    <text x="260" y="347" text-anchor="middle">RR + SpO2 + SBP + pulse + temp</text>
    <text x="260" y="370" text-anchor="middle">transparent deterministic guardrail</text>

    <rect x="475" y="290" rx="12" ry="12" width="250" height="95" fill="#eef5fb" stroke="#7da1bf"/>
    <text x="600" y="323" text-anchor="middle" font-weight="700">Risk context</text>
    <text x="600" y="347" text-anchor="middle">score + trends + concerning signals</text>
    <text x="600" y="370" text-anchor="middle">LOW / WATCH / HIGH / CRITICAL</text>

    <rect x="815" y="290" rx="12" ry="12" width="250" height="95" fill="#f7f0e7" stroke="#c29b6b"/>
    <text x="940" y="323" text-anchor="middle" font-weight="700">Local RAG</text>
    <text x="940" y="347" text-anchor="middle">bundled NICE text index</text>
    <text x="940" y="370" text-anchor="middle">source + page citations</text>

    <rect x="255" y="475" rx="12" ry="12" width="310" height="105" fill="#eef5fb" stroke="#7da1bf"/>
    <text x="410" y="510" text-anchor="middle" font-weight="700">Escalation policy</text>
    <text x="410" y="534" text-anchor="middle">routine / watch / urgent / emergency</text>
    <text x="410" y="558" text-anchor="middle">repeat-alert suppression</text>

    <rect x="635" y="475" rx="12" ry="12" width="310" height="105" fill="#f5eeee" stroke="#b87979"/>
    <text x="790" y="510" text-anchor="middle" font-weight="700">Controlled agent path</text>
    <text x="790" y="534" text-anchor="middle">optional Jev + evidence-grounded explanation</text>
    <text x="790" y="558" text-anchor="middle">offline template is the default</text>

    <rect x="255" y="640" rx="12" ry="12" width="310" height="70" fill="#ffffff" stroke="#9aa7b3"/>
    <text x="410" y="669" text-anchor="middle" font-weight="700">Clinician dashboard</text>
    <text x="410" y="690" text-anchor="middle">accept / dismiss / defer / investigate</text>

    <rect x="635" y="640" rx="12" ry="12" width="310" height="70" fill="#ffffff" stroke="#9aa7b3"/>
    <text x="790" y="669" text-anchor="middle" font-weight="700">Audit trail</text>
    <text x="790" y="690" text-anchor="middle">observations + evidence + alerts + decisions</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="245" y1="152" x2="300" y2="152"/>
    <line x1="490" y1="152" x2="545" y2="152"/>
    <line x1="765" y1="152" x2="820" y2="152"/>
    <line x1="930" y1="190" x2="940" y2="290"/>
    <line x1="655" y1="190" x2="600" y2="290"/>
    <line x1="820" y1="190" x2="260" y2="290"/>
    <line x1="385" y1="337" x2="475" y2="337"/>
    <line x1="725" y1="337" x2="815" y2="337"/>
    <line x1="600" y1="385" x2="410" y2="475"/>
    <line x1="940" y1="385" x2="790" y2="475"/>
    <line x1="565" y1="527" x2="635" y2="527"/>
    <line x1="410" y1="580" x2="410" y2="640"/>
    <line x1="790" y1="580" x2="790" y2="640"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
